# Reference only. The homelab GitOps repository owns deployed resources.
apiVersion: v1
kind: ConfigMap
metadata:
  name: portfolio-backend
  namespace: portfolio-dev
data:
  HTTP_ADDR: ":8080"
  HTTP_READ_HEADER_TIMEOUT: "5s"
  HTTP_READ_TIMEOUT: "10s"
  HTTP_WRITE_TIMEOUT: "10s"
  HTTP_IDLE_TIMEOUT: "60s"
  HTTP_SHUTDOWN_TIMEOUT: "15s"
  DB_MAX_CONNS: "5"
  DB_MIN_CONNS: "0"
  DB_CONNECT_TIMEOUT: "5s"
  DB_READINESS_TIMEOUT: "750ms"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-backend
  namespace: portfolio-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: portfolio-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: portfolio-backend
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # GitOps replaces this reference with an immutable release or commit tag.
          image: ghcr.io/home-compute-cluster/portfolio-backend:git-sha
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: portfolio-backend
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: portfolio-backend
                  key: DATABASE_URL
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true

---
apiVersion: v1
kind: Service
metadata:
  name: portfolio-backend
  namespace: portfolio-dev
spec:
  selector:
    app.kubernetes.io/name: portfolio-backend
  ports:
    - name: http
      port: 80
      targetPort: http
