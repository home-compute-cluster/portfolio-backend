# Reference only. The homelab GitOps repository owns deployed resources.
apiVersion: v1
kind: ConfigMap
metadata:
  name: portfolio-backend
  namespace: portfolio
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
data:
  HTTP_ADDR: ":8080"
  HTTP_READ_HEADER_TIMEOUT: "5s"
  HTTP_READ_TIMEOUT: "10s"
  HTTP_WRITE_TIMEOUT: "10s"
  HTTP_IDLE_TIMEOUT: "60s"
  HTTP_SHUTDOWN_TIMEOUT: "15s"
  DB_MAX_CONNS: "5"
  DB_MIN_CONNS: "0"
  DB_CONNECT_TIMEOUT: "5s"
  DB_READINESS_TIMEOUT: "750ms"
  DB_QUERY_TIMEOUT: "3s"
  MAX_AUTHOR_CHARS: "80"
  MAX_COMMENT_CHARS: "2000"
  MAX_COMMENTS_PER_POST: "1000"
  VIEW_DEDUP_WINDOW_HOURS: "24"
  RATE_COMMENTS_PER_MIN: "5"
  RATE_LIKES_PER_MIN: "30"
  RATE_READS_PER_MIN: "60"
  RATE_LIMIT_MAX_KEYS: "10000"
  # Trust the K3s pod network so the API can walk past Traefik and the
  # deus-local ServiceLB hop. Never use 0.0.0.0/0.
  TRUSTED_PROXY_CIDRS: "10.42.0.0/16"
  CF_ACCESS_TEAM_DOMAIN: "https://replace-me.cloudflareaccess.com"
  CF_ACCESS_AUD: "replace-with-access-application-aud"
  ADMIN_EMAIL: "replace-with-exact-admin-email"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-backend
  namespace: portfolio
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: portfolio-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: portfolio-backend
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # GitOps replaces this reference with an immutable release or commit tag.
          image: ghcr.io/home-compute-cluster/portfolio-backend:git-sha
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: portfolio-backend
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: portfolio-db-app
                  key: uri
            - name: VISITOR_HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: portfolio-backend
                  key: VISITOR_HMAC_KEY
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true

---
apiVersion: batch/v1
kind: Job
metadata:
  name: portfolio-backend-migrate
  namespace: portfolio
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: portfolio-backend-migrate
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/home-compute-cluster/portfolio-backend:git-sha
          command:
            - /migrate
          args:
            - -dir
            - /migrations
          envFrom:
            - configMapRef:
                name: portfolio-backend
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: portfolio-db-app
                  key: uri
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true

---
apiVersion: v1
kind: Service
metadata:
  name: portfolio-backend
  namespace: portfolio
spec:
  selector:
    app.kubernetes.io/name: portfolio-backend
  ports:
    - name: http
      port: 80
      targetPort: http

---
# Reference only. The homelab GitOps repository owns the live Traefik routes.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: portfolio-backend-public
  namespace: portfolio
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`site.packetcraft.dev`) && PathPrefix(`/api`)
      priority: 100
      services:
        - name: portfolio-backend
          port: http

---
# Cloudflare Access must protect this entire hostname before traffic reaches Traefik.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: portfolio-backend-admin
  namespace: portfolio
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`admin.site.packetcraft.dev`) && PathPrefix(`/api/admin`)
      priority: 200
      services:
        - name: portfolio-backend
          port: http
