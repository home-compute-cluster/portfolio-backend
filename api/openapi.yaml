openapi: 3.1.0
info:
  title: Packetcraft Backend API
  version: 0.1.0
  description: Dynamic API for packetcraft.dev.
servers:
  - url: /api
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Check API process liveness
      responses:
        "200":
          description: The API process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
              examples:
                healthy:
                  value:
                    status: ok
  /readyz:
    get:
      operationId: getReadiness
      summary: Check whether the API can serve traffic
      responses:
        "200":
          description: PostgreSQL is reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
              examples:
                ready:
                  value:
                    status: ready
        "503":
          description: PostgreSQL is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
              examples:
                unavailable:
                  value:
                    status: unavailable
  /posts/{slug}/comments:
    parameters:
      - $ref: "#/components/parameters/PostSlug"
    get:
      operationId: listPostComments
      summary: List visible comments newest first
      parameters:
        - name: before_id
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: A bounded page of visible comments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createPostComment
      summary: Publish a plain-text visitor comment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateComment"
      responses:
        "201":
          description: The comment was published.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "204":
          description: The honeypot submission was accepted without persistence.
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The post has reached its visible-comment limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: The request body exceeds 16 KiB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /posts/{slug}/view:
    parameters:
      - $ref: "#/components/parameters/PostSlug"
    post:
      operationId: recordPostView
      summary: Record a deduplicated post view
      description: A visitor contributes at most one view per rolling configured window.
      responses:
        "204":
          description: The view was accepted, including when it was already counted in the window.
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /posts/{slug}/like:
    parameters:
      - $ref: "#/components/parameters/PostSlug"
    put:
      operationId: likePost
      summary: Ensure the current visitor likes the post
      responses:
        "204":
          description: The desired liked state is established.
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: unlikePost
      summary: Ensure the current visitor does not like the post
      responses:
        "204":
          description: The desired unliked state is established.
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /posts/{slug}/stats:
    parameters:
      - $ref: "#/components/parameters/PostSlug"
    get:
      operationId: getPostStats
      summary: Get public view and like totals
      responses:
        "200":
          description: Aggregate statistics for the published post.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostStats"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  parameters:
    PostSlug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        maxLength: 100
        pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
  responses:
    BadRequest:
      description: The request is malformed or invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The published post is not registered.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Status:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
    Error:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: string
    CreateComment:
      type: object
      additionalProperties: false
      required:
        - author_name
        - body
      properties:
        author_name:
          type: string
          maxLength: 80
        body:
          type: string
          maxLength: 2000
        website:
          type: string
          description: Honeypot field; legitimate clients leave it empty.
    Comment:
      type: object
      additionalProperties: false
      required:
        - id
        - author_name
        - body
        - created_at
      properties:
        id:
          type: integer
          format: int64
        author_name:
          type: string
        body:
          type: string
        created_at:
          type: string
          format: date-time
    CommentPage:
      type: object
      additionalProperties: false
      required:
        - comments
        - next_before_id
      properties:
        comments:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/Comment"
        next_before_id:
          type:
            - integer
            - "null"
          format: int64
    PostStats:
      type: object
      additionalProperties: false
      required:
        - views
        - likes
      properties:
        views:
          type: integer
          format: int64
          minimum: 0
        likes:
          type: integer
          format: int64
          minimum: 0
